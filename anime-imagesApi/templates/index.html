<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Waifu Gallery</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>🎨 Waifu.pics Gallery</h1>
    <p>10 Random <span class="tag sfw">SFW</span> &amp; <span class="tag nsfw">NSFW</span> Images</p>
  </header>

  <section>
    <h2>SFW Images</h2>
    <div class="grid">
      {% for url in sfw_images %}
      <div class="item"><img src="{{ url }}" alt="SFW waifu"></div>
      {% endfor %}
    </div>
  </section>

  <section>
    <h2>NSFW Images</h2>
    <div class="grid">
      {% for url in nsfw_images %}
      <div class="item"><img src="{{ url }}" alt="NSFW waifu"></div>
      {% endfor %}
    </div>
  </section>
</body>
</html>
